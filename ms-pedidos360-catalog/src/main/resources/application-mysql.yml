# Perfil para usar MySQL/MariaDB instalado directamente en la instancia EC2
# (mientras no haya cupo de Oracle Autonomous DB). Actívalo con:
#   SPRING_PROFILES_ACTIVE=mysql
#
# Variables de entorno necesarias:
#   MYSQL_HOST      -> normalmente "localhost" si MySQL corre en la misma EC2
#   MYSQL_PORT      -> 3306 por defecto
#   MYSQL_DB        -> nombre de la base, ej: pedidos360
#   MYSQL_USER      -> usuario de la app, ej: pedidos360
#   MYSQL_PASSWORD  -> password de ese usuario

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DB}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true

  h2:
    console:
      enabled: false

  sql:
    init:
      mode: never
