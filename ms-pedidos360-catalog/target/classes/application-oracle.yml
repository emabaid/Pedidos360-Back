# Perfil para usar Oracle Autonomous Database (Always Free) en vez de H2.
# Actívalo con la variable de entorno: SPRING_PROFILES_ACTIVE=oracle
#
# Variables de entorno que este perfil necesita:
#   TNS_ADMIN            -> carpeta donde descomprimiste el wallet (contiene tnsnames.ora, ojdbc.properties, etc.)
#   ORACLE_DB_SERVICE     -> nombre del servicio del wallet, ej: pedidos360db_high
#   ORACLE_DB_USER        -> usuario creado en el paso 2 de la guía OCI (ej: pedidos360)
#   ORACLE_DB_PASSWORD    -> password de ese usuario
#
# Nota: el wallet trae un archivo cwallet.sso (auto-login), así que NO hace
# falta pasar el password del wallet en tiempo de ejecución, solo apuntar
# TNS_ADMIN a la carpeta correcta.

spring:
  datasource:
    url: jdbc:oracle:thin:@${ORACLE_DB_SERVICE}?TNS_ADMIN=${TNS_ADMIN}
    username: ${ORACLE_DB_USER}
    password: ${ORACLE_DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: update
    show-sql: true

  h2:
    console:
      enabled: false

  sql:
    init:
      mode: never # data.sql es solo para H2; en Oracle carga los datos manualmente o via un seeder aparte.
