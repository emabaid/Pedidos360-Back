# Perfil por defecto: H2 en archivo, para desarrollo rápido sin depender de OCI.
# Para producción/EC2 usa: SPRING_PROFILES_ACTIVE=oracle (ver application-oracle.yml)
server:
  port: 8081

spring:
  application:
    name: ms-pedidos360-orders

  datasource:
    url: jdbc:h2:file:./data/orders-db;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console

# URL interna de ms-pedidos360-catalog (red privada / localhost en el laboratorio)
pedidos360:
  catalog-base-url: http://localhost:8082

logging:
  level:
    abaid.pedidos360.orders: DEBUG
