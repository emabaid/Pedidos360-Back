# Perfil para usar MySQL/MariaDB instalado directamente en la instancia EC2
# (mientras no haya cupo de Oracle Autonomous DB). Actívalo con:
#   SPRING_PROFILES_ACTIVE=mysql
#
# Usa la MISMA base que ms-pedidos360-catalog (ORDERS/ORDER_ITEMS no chocan
# con PRODUCTS), mismas variables: MYSQL_HOST, MYSQL_PORT, MYSQL_DB,
# MYSQL_USER, MYSQL_PASSWORD

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DB}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true

  h2:
    console:
      enabled: false
